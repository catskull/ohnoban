<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ohnoban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="board-title"></h1>
  </header>
  <main id="board"></main>

  <dialog id="card-dialog">
    <form method="dialog">
      <label>Title<input name="title" required></label>
      <label>Description<textarea name="description" rows="3"></textarea></label>
      <fieldset id="tag-options"><legend>Tags</legend></fieldset>
      <div class="dialog-actions">
        <button value="save" type="submit">Save</button>
        <button value="cancel" type="submit" formnovalidate>Cancel</button>
        <button value="delete" type="submit" formnovalidate class="delete-btn">Delete</button>
      </div>
    </form>
  </dialog>

  <script>
    fetch("board.json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("board-title").textContent = data.title;
        const board = document.getElementById("board");
        const dialog = document.getElementById("card-dialog");
        const form = dialog.querySelector("form");
        const tagOptions = document.getElementById("tag-options");
        let editingCard = null;
        let targetUl = null;

        // build tag checkboxes
        for (const [name, color] of Object.entries(data.tags)) {
          const lbl = document.createElement("label");
          lbl.className = "tag-option";
          lbl.innerHTML = `<input type="checkbox" name="tags" value="${name}"><span class="tag" style="background:${color}">${name}</span>`;
          tagOptions.appendChild(lbl);
        }

        function renderCard(card) {
          const li = document.createElement("li");
          li.className = "card";
          li.draggable = true;
          fillCard(li, card);
          return li;
        }

        function fillCard(li, card) {
          li.innerHTML = `
            <strong>${card.title}</strong>
            ${card.description ? `<p>${card.description}</p>` : ""}
            ${(card.tags || []).length ? `<div class="tags">${card.tags.map(t =>
              `<span class="tag" style="background:${data.tags[t]}">${t}</span>`
            ).join("")}</div>` : ""}
          `;
        }

        function readCard(li) {
          return {
            title: li.querySelector("strong").textContent,
            description: li.querySelector("p")?.textContent || "",
            tags: [...li.querySelectorAll(".tag")].map(t => t.textContent)
          };
        }

        // render columns
        for (const col of data.columns) {
          const section = document.createElement("section");
          section.className = "column";

          const header = document.createElement("h2");
          header.innerHTML = `${col.title}<span class="count">${col.cards.length}</span>`;

          const addLink = document.createElement("a");
          addLink.className = "add-card";
          addLink.textContent = "+ Add card";
          addLink.href = "#";

          const ul = document.createElement("ul");
          for (const card of col.cards) ul.appendChild(renderCard(card));

          section.append(header, addLink, ul);
          board.appendChild(section);
        }

        // open dialog for new card
        board.addEventListener("click", e => {
          const addLink = e.target.closest(".add-card");
          if (addLink) {
            e.preventDefault();
            editingCard = null;
            targetUl = addLink.closest(".column").querySelector("ul");
            form.reset();
            dialog.querySelector(".delete-btn").hidden = true;
            dialog.showModal();
            return;
          }

          const card = e.target.closest(".card");
          if (card) {
            editingCard = card;
            targetUl = null;
            const cardData = readCard(card);
            form.title.value = cardData.title;
            form.description.value = cardData.description;
            form.querySelectorAll('input[name="tags"]').forEach(cb => {
              cb.checked = cardData.tags.includes(cb.value);
            });
            dialog.querySelector(".delete-btn").hidden = false;
            dialog.showModal();
          }
        });

        dialog.addEventListener("click", e => {
          if (e.target === dialog) dialog.close("cancel");
        });

        // handle dialog close
        dialog.addEventListener("close", () => {
          if (dialog.returnValue === "save") {
            const cardData = {
              title: form.title.value.trim(),
              description: form.description.value.trim(),
              tags: [...form.querySelectorAll('input[name="tags"]:checked')].map(cb => cb.value)
            };
            if (!cardData.title) return;

            if (editingCard) {
              fillCard(editingCard, cardData);
            } else {
              targetUl.appendChild(renderCard(cardData));
            }
            updateCounts();
          } else if (dialog.returnValue === "delete" && editingCard) {
            editingCard.remove();
            updateCounts();
          }
          editingCard = null;
          targetUl = null;
        });

        // --- drag and drop ---
        let dragged = null;
        let overCol = null;
        let lastY = 0;

        function clearDragOver() {
          if (overCol) { overCol.classList.remove("drag-over"); overCol = null; }
        }

        board.addEventListener("dragstart", e => {
          const card = e.target.closest(".card");
          if (!card) return;
          dragged = card;
          card.classList.add("dragging");
        });

        board.addEventListener("dragend", () => {
          if (dragged) dragged.classList.remove("dragging");
          clearDragOver();
          dragged = null;
          lastY = 0;
        });

        board.addEventListener("dragover", e => {
          e.preventDefault();
          const col = e.target.closest(".column");
          if (!col) return;

          if (col !== overCol) {
            clearDragOver();
            overCol = col;
            col.classList.add("drag-over");
          }

          if (Math.abs(e.clientY - lastY) < 5) return;
          lastY = e.clientY;

          const ul = col.querySelector("ul");
          const afterCard = getDragAfterCard(ul, e.clientY);
          if (afterCard) {
            ul.insertBefore(dragged, afterCard);
          } else {
            ul.appendChild(dragged);
          }
        });

        board.addEventListener("drop", e => {
          e.preventDefault();
          clearDragOver();
          updateCounts();
        });

        function getDragAfterCard(ul, y) {
          const cards = [...ul.querySelectorAll(".card:not(.dragging)")];
          for (const card of cards) {
            const box = card.getBoundingClientRect();
            if (y < box.top + box.height / 2) return card;
          }
          return null;
        }

        function updateCounts() {
          document.querySelectorAll(".column").forEach(col => {
            col.querySelector(".count").textContent = col.querySelectorAll(".card").length;
          });
        }
      });
  </script>
</body>
</html>
