<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ohnoban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="board-title"></h1>
  </header>
  <main id="board"></main>
  <script>
    fetch("board.json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("board-title").textContent = data.title;
        const board = document.getElementById("board");
        for (const col of data.columns) {
          const section = document.createElement("section");
          section.className = "column";
          section.innerHTML = `
            <h2>${col.title}<span class="count">${col.cards.length}</span></h2>
            <ul>
              ${col.cards.map(card => `
                <li class="card" draggable="true">
                  <strong>${card.title}</strong>
                  ${card.description ? `<p>${card.description}</p>` : ""}
                  ${(card.tags || []).length ? `<div class="tags">${card.tags.map(t =>
                    `<span class="tag" style="background:${data.tags[t]}">${t}</span>`
                  ).join("")}</div>` : ""}
                </li>
              `).join("")}
            </ul>
          `;
          board.appendChild(section);
        }

        let dragged = null;
        let overCol = null;
        let lastY = 0;

        function clearDragOver() {
          if (overCol) { overCol.classList.remove("drag-over"); overCol = null; }
        }

        board.addEventListener("dragstart", e => {
          const card = e.target.closest(".card");
          if (!card) return;
          dragged = card;
          card.classList.add("dragging");
        });

        board.addEventListener("dragend", () => {
          if (dragged) dragged.classList.remove("dragging");
          clearDragOver();
          dragged = null;
          lastY = 0;
        });

        board.addEventListener("dragover", e => {
          e.preventDefault();
          const col = e.target.closest(".column");
          if (!col) return;

          if (col !== overCol) {
            clearDragOver();
            overCol = col;
            col.classList.add("drag-over");
          }

          if (Math.abs(e.clientY - lastY) < 5) return;
          lastY = e.clientY;

          const ul = col.querySelector("ul");
          const afterCard = getDragAfterCard(ul, e.clientY);
          if (afterCard) {
            ul.insertBefore(dragged, afterCard);
          } else {
            ul.appendChild(dragged);
          }
        });

        board.addEventListener("drop", e => {
          e.preventDefault();
          clearDragOver();
          updateCounts();
        });

        function getDragAfterCard(ul, y) {
          const cards = [...ul.querySelectorAll(".card:not(.dragging)")];
          for (const card of cards) {
            const box = card.getBoundingClientRect();
            if (y < box.top + box.height / 2) return card;
          }
          return null;
        }

        function updateCounts() {
          document.querySelectorAll(".column").forEach(col => {
            col.querySelector(".count").textContent = col.querySelectorAll(".card").length;
          });
        }
      });
  </script>
</body>
</html>
