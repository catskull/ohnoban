<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ohnoban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="board-title"></h1>
    <button id="add-column-btn" type="button" title="Add column">+ Column</button>
    <button id="settings-btn" type="button" title="Board settings">&#9881;</button>
  </header>
  <main id="board"></main>

  <dialog id="card-dialog">
    <div class="card-view"></div>
    <form method="dialog">
      <div class="card-edit">
        <label>Title<input name="title" required></label>
        <label>Description<textarea name="description" rows="8"></textarea></label>
        <fieldset id="tag-options"><legend>Tags</legend></fieldset>
      </div>
      <div class="view-actions">
        <button type="button" class="edit-btn">Edit</button>
        <button value="cancel" type="submit" formnovalidate>Close</button>
      </div>
      <div class="edit-actions">
        <button value="save" type="submit">Save</button>
        <button value="cancel" type="submit" formnovalidate>Cancel</button>
        <button value="delete" type="submit" formnovalidate class="delete-btn">Delete</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h3>Board Settings</h3>
      <label>Board Name<input name="board-name" id="board-name-input" required></label>
      <fieldset id="tag-manager">
        <legend>Tags</legend>
        <div id="tag-list"></div>
        <button type="button" id="add-tag-btn">+ Add tag</button>
      </fieldset>
      <fieldset class="io-actions">
        <legend>Data</legend>
        <button type="button" id="export-btn">Export JSON</button>
        <button type="button" id="import-btn">Import JSON</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </fieldset>
      <fieldset class="auth-actions">
        <legend>Passkey (WebAuthn + PRF)</legend>
        <div id="auth-status">Not registered</div>
        <button type="button" id="register-passkey-btn">Register passkey</button>
        <button type="button" id="test-auth-btn">Test authentication</button>
        <button type="button" id="forget-passkey-btn">Forget passkey</button>
        <pre id="auth-output" hidden></pre>
      </fieldset>
      <div class="settings-actions">
        <button value="save" type="submit">Save</button>
        <button value="cancel" type="submit" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="marked.min.js"></script>
  <script type="module" src="board.js"></script>
</body>
</html>
